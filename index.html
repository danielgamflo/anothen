<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anothen — Próximamente</title>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: crosshair;
            --reveal-x: 0px;
            --reveal-y: 0px;
            --reveal-radius: 120px;
            --fade-radius: 60px;
        }

        /* Background with subtle overlay - BLURRED version by default */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.2) 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -2;
            animation: subtleZoom 20s ease-in-out infinite;
            opacity: 0;
            transition: opacity 0.5s ease-in 0.3s;
        }

        body.image-loaded::before {
            opacity: 1;
        }


        @media (prefers-reduced-motion: reduce) {
            body::before {
                animation: none;
            }
        }

        @keyframes subtleZoom {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        /* Parallax zoom out animation - slide 01 */
        @keyframes parallaxZoomOut {
            0% {
                transform: scale(1.25);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Parallax zoom out with fade in - slide 02 */
        @keyframes parallaxZoomOutFadeIn {
            0% {
                transform: scale(1.20);
                opacity: 0.3;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Slide up with zoom out - slide 03 */
        @keyframes slideUpZoomOut {
            0% {
                transform: translateY(100vh) scale(1.30);
                opacity: 1;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Slide up with zoom out - slide 03 (mobile) */
        @keyframes slideUpZoomOutMobile {
            0% {
                transform: translateY(100vh) scale(1.10);
                opacity: 1;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Slide up with zoom out - slide 04 (50vh) */
        @keyframes slideUpZoomOut04 {
            0% {
                transform: translateY(50vh) scale(1.50);
                opacity: 1;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Slide up with zoom out - slide 05 (25vh) */
        @keyframes slideUpZoomOut05 {
            0% {
                transform: translateY(25vh) scale(1.60);
                opacity: 1;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Parallax background layer */
        .parallax-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Capas en decenas: deja hueco para insertar elementos entre ellas
           (los pájaros van en 25, entre slide-02 y slide-03) */
        .parallax-layer-01 {
            background-image: url('./Images/parallax/slide-01.png?v=20260817-5');
            animation: parallaxZoomOut 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            z-index: 10;
        }

        .parallax-layer-02 {
            background-image: url('./Images/parallax/slide-02.png?v=20260817-5');
            animation: parallaxZoomOutFadeIn 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            z-index: 20;
        }

        .parallax-layer-03 {
            background-image: url('./Images/parallax/slide-03.png?v=20260817-5');
            animation: slideUpZoomOut 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s forwards;
            z-index: 30;
            opacity: 0;
        }

        .parallax-layer-04 {
            background-image: url('./Images/parallax/slide-04.png?v=20260817-5');
            animation: slideUpZoomOut04 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            z-index: 40;
        }

        .parallax-layer-05 {
            background-image: url('./Images/parallax/slide-05.png?v=20260817-5');
            animation: slideUpZoomOut05 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            z-index: 50;
        }

        /* Main container */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            z-index: 100;
            box-sizing: border-box;
        }

        /* Content sections */
        .content-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 0.5rem;
        }

        .content-section.top {
            flex: 0 0 auto;
        }

        .content-section.middle {
            flex: 1 1 auto;
        }

        .content-section.bottom {
            flex: 0 0 auto;
            margin-bottom: 5rem;
        }

        /* Logo area */
        .logo-area {
            position: relative;
            width: fit-content;
            margin: 0 auto;
            text-align: center;
            z-index: 10;
            color: #403e2c;
            animation: fadeInUp 0.8s ease-out 1.7s both, breathe 6s ease-in-out 2.7s infinite;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo-area:hover {
            transform: scale(1.05) !important;
        }

        .logo-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.1em;
            font-weight: 300;
        }

        .logo-text {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            letter-spacing: 0.15em;
            font-weight: 400;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }

        /* Content wrapper - deprecated, use content-section instead */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            max-width: 900px;
            position: relative;
            z-index: 10;
        }

        /* Title */
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(3rem, 10vw, 7.2rem);
            font-weight: 400;
            letter-spacing: 0.12em;
            text-align: center;
            line-height: 1.2;
            max-width: 85vw;
            text-transform: uppercase;
            color: #4d473d;
            display: none; /* Hidden for parallax effect */
            animation: fadeInUp 0.8s ease-out 0.4s both, glow 3s ease-in-out 1.2s infinite;
            background: linear-gradient(90deg, transparent 0%, rgba(242, 230, 218, 0.4) 50%, transparent 100%);
            background-size: 1000px 100%;
            background-clip: text;
            -webkit-background-clip: text;
            animation: fadeInUp 0.8s ease-out 0.4s both, glow 3s ease-in-out 1.2s infinite, shimmer 3s linear infinite;
        }

        /* Description text */
        .description {
            font-size: clamp(13px, 2vw, 16px);
            line-height: 1;
            text-align: center;
            max-width: min(60vw, 500px);
            position: relative;
            z-index: 10;
            margin-top: 2rem;
            color: #4b4d37;
            white-space: nowrap;
            font-weight: 300;
            letter-spacing: 0.02em;
            animation: fadeInUp 0.8s ease-out 2.2s both;
        }

        /* En desktop la frase va en una sola linea: se anula el salto y queda
           el espacio que lo precede. En movil (768px) vuelve a dos lineas. */
        .description .salto-movil {
            display: none;
        }

        /* Subscription form */
        .subscription-form {
            display: flex;
            gap: 0;
            align-items: stretch;
            margin-top: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 100%;
            animation: fadeInUp 0.8s ease-out 2.3s both;
        }

        .subscription-form input {
            padding: 1rem 1.5rem;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            background-color: #f4f4ee;
            color: #423c33;
            flex: 1;
            min-width: 300px;
            transition: all 0.3s ease;
            letter-spacing: -0.02em;
        }

        .subscription-form input::placeholder {
            color: #a5a5a5;
            font-style: normal;
            font-family: 'Outfit', sans-serif;
        }

        .subscription-form input:focus {
            outline: none;
            background-color: #ffffff;
            box-shadow: inset 0 0 0 2px #403e2c;
            transition: all 0.3s ease;
        }

        .subscription-form button {
            padding: 1rem 2.5rem;
            border: none;
            background-color: #897c4b;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .subscription-form button:hover {
            background-color: #6b5d3a;
            transform: translateY(-2px);
        }

        .subscription-form button:active {
            transform: translateY(0);
        }

        /* Success message */
        .success-message {
            display: none;
            text-align: center;
            margin-top: 1rem;
            opacity: 0.9;
            font-size: 14px;
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 0.9;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 4px rgba(211, 212, 186, 1));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(211, 212, 186, 1)) drop-shadow(0 0 30px rgba(211, 212, 186, 0.6));
                transform: scale(1.08);
            }
            100% {
                filter: drop-shadow(0 0 4px rgba(211, 212, 186, 1));
                transform: scale(1);
            }
        }

        @keyframes fadeOutSubtle {
            from {
                opacity: 1;
                filter: drop-shadow(0 0 8px rgba(211, 212, 186, 0.6));
                transform: scale(1);
            }
            to {
                opacity: 1;
                filter: drop-shadow(0 0 0px rgba(211, 212, 186, 0));
                transform: scale(0.95);
            }
        }

        /* Sound icon states */
        #sound-hint {
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #sound-hint.active {
            animation: pulseGlow 1.5s ease-in-out infinite;
        }

        #sound-hint.deactivating {
            animation: fadeOutSubtle 0.8s ease-out forwards;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(219, 212, 202, 0.3);
            }
            50% {
                text-shadow: 0 0 40px rgba(219, 212, 202, 0.6);
            }
        }

        @keyframes breathe {
            0%, 100% {
                opacity: 0.85;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.08);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) translateX(0px);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) translateX(var(--tx, 0px));
                opacity: 0;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }

        /* Particle styles */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 60;
        }

        .particle::before {
            content: '';
            display: block;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(242, 230, 218, 0.9) 0%, rgba(242, 230, 218, 0) 70%);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(242, 230, 218, 0.8), 0 0 12px rgba(242, 230, 218, 0.5);
        }

        @keyframes flyBird {
            0% {
                left: -100px;
            }
            100% {
                left: calc(100vw + 100px);
            }
        }

        /* Aves: vuelan entre slide-02 y slide-03, así el bosque las tapa */
        #birds-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 25;
            pointer-events: none;
        }

        /* Subscription hint */
        .subscription-hint {
            font-size: 12px;
            color: rgba(242, 230, 218, 0.65);
            letter-spacing: 0.03em;
            text-align: center;
            margin-top: 1rem;
            line-height: 1.5;
            font-weight: 300;
            opacity: 0.8;
            animation: fadeInUp 0.8s ease-out 2.4s both;
            white-space: nowrap;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .logo-area {
                top: 0.5rem;
            }

            .logo-area img {
                max-width: 120px !important;
                margin-bottom: 0.2rem !important;
            }

            .logo-text {
                font-size: 1.4rem;
            }

            .content-wrapper {
                gap: 1.2rem;
                margin-top: 1.5rem;
            }

            .subscription-hint {
                white-space: normal;
            }

            h1 {
                font-size: clamp(2.5rem, 9vw, 4.5rem);
            }

            .description {
                font-size: 14px;
                max-width: 85vw;
                line-height: 1;
            }

            /* En movil la frase vuelve a partirse en dos lineas */
            .description .salto-movil {
                display: inline;
            }

            .parallax-layer-03 {
                background-image: url('./Images/parallax/slide-03-movil.png?v=20260817-5');
                background-size: contain;
                background-position: center;
                background-repeat: no-repeat;
                animation: slideUpZoomOutMobile 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s forwards;
            }

            .subscription-form {
                gap: 0;
                flex-direction: column;
                width: 90%;
                max-width: 100%;
            }

            .subscription-form input {
                width: 100%;
                min-width: 100%;
                border-radius: 4px 4px 0 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                font-family: 'Outfit', sans-serif;
                background-color: #f4f4ee;
            }

            .subscription-form button {
                width: 100%;
                border-radius: 0 0 4px 4px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
                height: 100dvh;
                padding-bottom: 4rem;
            }

            .content-section {
                gap: 0.2rem;
            }

            .content-section.bottom {
                gap: 1rem;
            }

            .logo-area {
                margin-top: 0;
            }

            .logo-text {
                font-size: 1.1rem;
                letter-spacing: 0.1em;
            }

            .content-wrapper {
                gap: 1rem;
            }

            h1 {
                font-size: clamp(2rem, 8vw, 3.5rem);
                letter-spacing: 0.08em;
            }

            .description {
                font-size: 13px;
                max-width: 70vw;
                line-height: 1;
                margin: 1.4rem 0 1.1rem;
            }

            .subscription-form input {
                font-size: 16px;
                padding: 0.75rem 1rem;
                border-radius: 4px 4px 0 0;
                font-family: 'Outfit', sans-serif;
                background-color: #f4f4ee;
            }

            .subscription-form button {
                font-size: 10px;
                padding: 0.75rem 1rem;
                border-radius: 0 0 4px 4px;
                letter-spacing: 0.1em;
            }
        }
    </style>
</head>
<body>
    <!-- Parallax background layers -->
    <div class="parallax-bg parallax-layer-01"></div>
    <div class="parallax-bg parallax-layer-02"></div>
    <div class="parallax-bg parallax-layer-03"></div>
    <div class="parallax-bg parallax-layer-04"></div>
    <div class="parallax-bg parallax-layer-05"></div>

    <!-- 3D Birds Canvas -->
    <canvas id="birds-canvas"></canvas>

    <div id="particles-container"></div>
    <button id="sound-hint" style="position: fixed; top: 1rem; right: 1rem; width: 48px; height: 48px; border: none; background: none; cursor: pointer; z-index: 110; opacity: 0; animation: fadeInUp 0.8s ease-out 3.0s both; padding: 0; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="#d3d4ba" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <!-- Speaker cone -->
            <path d="M 3 9 L 7 9 L 12 4 L 12 20 L 7 15 L 3 15 Z"></path>
            <!-- Sound waves -->
            <path d="M 16 6 Q 18 8 18 12 Q 18 16 16 18"></path>
            <path d="M 20 2 Q 23 5 23 12 Q 23 19 20 22"></path>
        </svg>
    </button>
    <div class="container">
        <!-- TOP SECTION: Logo, Separator, Description -->
        <div class="content-section top">
            <div class="logo-area" id="logo">
                <img src="./Images/Anothen-logo.svg?v=20260817-5" alt="Anothen" class="logo" style="height: 124px; width: auto; display: block; margin: 0 auto;">
            </div>

            <p class="description">
                Una marca con propósito <br class="salto-movil">para acompañarte día a día
            </p>
        </div>

        <!-- MIDDLE SECTION: Spacer (grows to fill viewport) -->
        <div class="content-section middle"></div>

        <!-- BOTTOM SECTION: Form, Success, Hint -->
        <div class="content-section bottom">
            <form class="subscription-form" id="subscriptionForm">
                <input
                    type="email"
                    placeholder="Tu correo electrónico"
                    required
                    aria-label="Correo electrónico"
                >
                <button type="submit">Suscribirme</button>
            </form>

            <div class="success-message" id="successMessage">
                ✓ Gracias. Te notificaremos pronto.
            </div>

            <p class="subscription-hint">
                Síguenos de cerca. Sé el primero en saber cuándo llegamos.
            </p>
        </div>
    </div>

    <script>
        // Load background images dynamically
        window.addEventListener('DOMContentLoaded', function() {
            // Load blurred image for overlay (revela blur en spotlight)
            const blurImg = new Image();
            blurImg.onload = function() {
                const overlay = document.getElementById('blurred-overlay');
                if (overlay) {
                    overlay.style.backgroundImage = "url('./Images/Slide-web-02-blur.jpg?v=20260817-5')";
                    overlay.style.backgroundSize = "cover";
                    overlay.style.backgroundPosition = "center";
                }
                document.body.classList.add('image-loaded');
            };
            blurImg.onerror = function() {
                console.log('Blurred image not found');
            };
            blurImg.src = './Images/Slide-web-02-blur.jpg?v=20260817-5';

            // Load sharp image for body::before (fondo enfocado)
            const sharpImg = new Image();
            sharpImg.onload = function() {
                const style = document.createElement('style');
                style.textContent = `body::before { background-image: url('./Images/Slide-web-01.jpg?v=20260817-5') !important; }`;
                document.head.appendChild(style);
            };
            sharpImg.onerror = function() {
                console.log('Sharp background image not found');
            };
            sharpImg.src = './Images/Slide-web-01.jpg?v=20260817-5';
        });

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles-container');
            const particleCount = 60;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                const startX = Math.random() * window.innerWidth;
                const duration = 15 + Math.random() * 15; // 15-30 seconds
                const delay = Math.random() * 5;

                particle.style.left = startX + 'px';
                particle.style.top = window.innerHeight + 'px';
                particle.style.animation = `float ${duration}s linear ${delay}s infinite`;

                container.appendChild(particle);
            }
        }

        createParticles();

        // Create flying birds
        function createBirds() {
            const container = document.getElementById('particles-container');

            function createBird() {
                const bird = document.createElement('div');
                bird.className = 'bird';

                const startY = Math.random() * (window.innerHeight * 0.4) + window.innerHeight * 0.05; // 5% to 45%
                const duration = 18 + Math.random() * 12; // 18-30 seconds
                const delay = Math.random() * 15;

                bird.style.top = startY + 'px';
                bird.style.animation = `flyBird ${duration}s linear ${delay}s infinite`;

                container.appendChild(bird);
            }

            // Create 3-5 birds
            const birdCount = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < birdCount; i++) {
                createBird();
            }
        }

        createBirds();

        // Create ambient enchanted background music
        function createAmbientBackgroundMusic() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();

            // Create multiple oscillators for a rich ambient pad
            function createAmbientPad() {
                const frequencies = [110, 165, 220, 277]; // Deep magical frequencies
                const oscillators = [];
                const gains = [];

                frequencies.forEach((freq, index) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();

                    osc.connect(gain);
                    gain.connect(audioContext.destination);

                    osc.type = 'sine';
                    osc.frequency.value = freq;

                    // Gentle volume with slight variation
                    gain.gain.setValueAtTime(0.08 + (Math.random() * 0.04), audioContext.currentTime);

                    // Create subtle wave modulation
                    const lfo = audioContext.createOscillator();
                    const lfoGain = audioContext.createGain();
                    lfo.frequency.value = 0.3 + (index * 0.1); // Slow modulation
                    lfo.connect(lfoGain);
                    lfoGain.connect(gain.gain);
                    lfoGain.gain.value = 0.02;

                    osc.start(audioContext.currentTime);
                    lfo.start(audioContext.currentTime);

                    oscillators.push(osc);
                    gains.push(gain);
                });
            }

            createAmbientPad();
        }

        // Toggle ambient sound with click
        let soundStarted = false;
        let audioContext = null;
        let oscillators = [];

        const hint = document.getElementById('sound-hint');
        hint.addEventListener('click', function toggleSound() {

            if (!soundStarted) {
                // Start sound
                audioContext = new (window.AudioContext || window.webkitAudioContext)();

                // Resume audio context on mobile (required for autoplay policy)
                if (audioContext.state === 'suspended') {
                    audioContext.resume().catch(e => console.log('Audio resume failed:', e));
                }

                // Epic, ethereal frequencies like Enya (no heavy bass)
                const frequencies = [110, 165, 220, 277, 330, 440]; // Mid to high frequencies
                const isMobile = window.innerWidth <= 768;
                const baseVolume = isMobile ? 0.1 : 0.06; // Subtle but present

                frequencies.forEach((freq, index) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();

                    osc.connect(gain);
                    gain.connect(audioContext.destination);

                    osc.type = 'sine';
                    osc.frequency.value = freq;

                    // Start with volume 0, fade in to target volume over 1 second
                    const targetVolume = (baseVolume / (index + 1)) * 0.8;
                    gain.gain.setValueAtTime(0, audioContext.currentTime);
                    gain.gain.linearRampToValueAtTime(targetVolume, audioContext.currentTime + 1);

                    // Slow, smooth LFO for ethereal effect
                    const lfo = audioContext.createOscillator();
                    const lfoGain = audioContext.createGain();
                    lfo.type = 'sine';
                    lfo.frequency.value = 0.15 + (index * 0.08); // Very slow modulation
                    lfo.connect(lfoGain);
                    lfoGain.connect(gain.gain);
                    lfoGain.gain.value = 0.02; // Subtle, smooth breathing

                    osc.start(audioContext.currentTime);
                    lfo.start(audioContext.currentTime);

                    oscillators.push({ osc, lfo, gain });
                });

                soundStarted = true;
                if (hint) {
                    hint.classList.remove('deactivating');
                    hint.classList.add('active');
                }
            } else {
                // Stop sound immediately
                const fadeOutDuration = 0; // Instant stop
                const stopTime = audioContext.currentTime + fadeOutDuration;

                oscillators.forEach(({ osc, lfo, gain }) => {
                    // Fade out volume very smoothly over 3.5 seconds - imperceptible cut
                    gain.gain.cancelScheduledValues(audioContext.currentTime);
                    gain.gain.linearRampToValueAtTime(0.00001, stopTime); // Almost to 0, not abrupt stop

                    // Stop oscillators only after fade completes
                    osc.stop(stopTime + 0.1);
                    lfo.stop(stopTime + 0.1);
                });

                // Clean up after fade out completes
                setTimeout(() => {
                    oscillators = [];
                    if (audioContext && audioContext.state !== 'closed') {
                        audioContext.close();
                    }
                    audioContext = null;
                }, (fadeOutDuration + 0.2) * 1000); // Wait for complete fade

                soundStarted = false;
                if (hint) {
                    hint.classList.remove('active');
                    hint.classList.add('deactivating');
                    setTimeout(() => hint.classList.remove('deactivating'), 800);
                }
            }
        });

        const form = document.getElementById('subscriptionForm');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = form.querySelector('input[type="email"]').value;

            // Here you would typically send the email to your backend
            console.log('Email subscribed:', email);

            // Show success message
            form.style.display = 'none';
            successMessage.classList.add('show');

            // Optional: Reset form after 3 seconds
            setTimeout(() => {
                form.reset();
                form.style.display = 'flex';
                successMessage.classList.remove('show');
            }, 3000);
        });

        // Prevent zoom/pinch on mobile
        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        // Prevent double-tap zoom
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
    </script>

    <!-- Aves en vuelo (canvas 2D, sin dependencias) -->
    <script>
        (function () {
            const cv = document.getElementById('birds-canvas');
            if (!cv) return;
            const ctx = cv.getContext('2d');

            let W, H;
            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = window.innerWidth;
                H = window.innerHeight;
                cv.width = W * dpr;
                cv.height = H * dpr;
                cv.style.width = W + 'px';
                cv.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resize();
            window.addEventListener('resize', resize);

            const COUNT = window.innerWidth <= 768 ? 10 : 16;
            const SIZE = 10;
            const SPEED = 6;
            const FLAP = 7;

            // Profundidad: un solo valor gobierna tamaño, color y velocidad
            const DEPTH_MIN = 0.55;                  // lejana: pequeña, clara, lenta
            const DEPTH_MAX = 1.30;                  // cercana: grande, oscura, rápida
            const COLOR_FAR = [0x7a, 0x7d, 0x6d];    // #7a7d6d
            const COLOR_NEAR = [0x40, 0x3e, 0x2c];   // #403e2c

            const mouse = { x: -9999, y: -9999 };
            document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
            document.addEventListener('touchmove', e => {
                if (e.touches.length) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
            }, { passive: true });

            function depthColor(t) {
                const c = COLOR_FAR.map((far, i) => Math.round(far + (COLOR_NEAR[i] - far) * t));
                return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
            }

            function makeBird() {
                const depth = DEPTH_MIN + Math.random() * (DEPTH_MAX - DEPTH_MIN);
                const t = (depth - DEPTH_MIN) / (DEPTH_MAX - DEPTH_MIN);
                return {
                    x: Math.random() * W,
                    y: Math.random() * H * 0.7,
                    vx: (0.5 + Math.random() * 0.4) * depth,
                    vy: (Math.random() - 0.5) * 0.25 * depth,
                    depth: depth,
                    color: depthColor(t),
                    phase: Math.random() * Math.PI * 2,
                    flapRate: 0.7 + Math.random() * 0.6,
                    wander: Math.random() * Math.PI * 2,
                    bank: 0,
                    gliding: Math.random() < 0.3,
                    flapAmp: 1,
                    glideTimer: 40 + Math.random() * 120
                };
            }

            const birds = [];
            for (let i = 0; i < COUNT; i++) birds.push(makeBird());
            // Las lejanas se dibujan primero: las cercanas quedan por encima
            birds.sort(function (a, b) { return a.depth - b.depth; });

            function drawBird(b) {
                // Onda de aleteo: seno puro. La asimetría del batido vive en la
                // velocidad de fase y la entrada al planeo en flapAmp, ambas
                // continuas, para que no haya saltos entre ciclos.
                const f = Math.sin(b.phase) * b.flapAmp;

                const span = 17;                     // envergadura: alas largas
                const tipY = -(3.2 + f * 6);         // punta del ala
                const wristY = -(0.8 + f * 2);       // codo del ala (crea la "M")

                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.bank);
                ctx.scale(b.depth * SIZE / 10, b.depth * SIZE / 10);
                ctx.fillStyle = b.color;

                ctx.beginPath();
                ctx.moveTo(-span, tipY);
                ctx.quadraticCurveTo(-span * 0.6, wristY - 0.9, 0, -1.1);
                ctx.quadraticCurveTo(span * 0.6, wristY - 0.9, span, tipY);
                ctx.quadraticCurveTo(span * 0.44, wristY + 1.9, 0, 1.7);
                ctx.quadraticCurveTo(-span * 0.44, wristY + 1.9, -span, tipY);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            function update(b) {
                // Parallax: el desplazamiento aparente cae con la distancia
                // igual que el tamaño, así que ambos escalan con depth.
                const cruise = (SPEED / 10) * b.depth;

                b.wander += 0.008;
                b.vy += Math.sin(b.wander) * 0.005 * b.depth;

                // Huir del cursor: las lejanas se inmutan menos
                const dx = b.x - mouse.x;
                const dy = b.y - mouse.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 130 && dist > 0) {
                    const force = (130 - dist) / 130 * 0.22 * b.depth;
                    b.vx += (dx / dist) * force;
                    b.vy += (dy / dist) * force;
                    b.gliding = false;
                }

                b.vx += (cruise - b.vx) * 0.012;
                b.vy *= 0.985;
                b.vy = Math.max(-1.4 * b.depth, Math.min(1.4 * b.depth, b.vy));
                b.vx = Math.max(0.1, Math.min(3.5 * b.depth, b.vx));

                b.x += b.vx;
                b.y += b.vy;
                b.bank += (b.vy * 0.13 - b.bank) * 0.08;

                b.glideTimer -= 1;
                if (b.glideTimer <= 0) {
                    b.gliding = !b.gliding;
                    b.glideTimer = b.gliding ? 50 + Math.random() * 90 : 90 + Math.random() * 160;
                }

                // La amplitud entra y sale del planeo de forma gradual
                b.flapAmp += ((b.gliding ? 0.09 : 1) - b.flapAmp) * 0.035;

                // Batido asimétrico modulando la velocidad de fase
                const climb = 1 + Math.max(0, -b.vy) * 0.3;
                const stroke = 1 - 0.55 * Math.cos(b.phase);
                b.phase += (FLAP / 100) * b.flapRate * climb * stroke * (0.25 + 0.75 * b.flapAmp);

                if (b.x > W + 50) { b.x = -50; b.y = Math.random() * H * 0.7; }
                if (b.y < -50) b.y = H + 50;
                if (b.y > H + 50) b.y = -50;
            }

            function frame() {
                ctx.clearRect(0, 0, W, H);
                for (let i = 0; i < birds.length; i++) {
                    update(birds[i]);
                    drawBird(birds[i]);
                }
                requestAnimationFrame(frame);
            }
            frame();
        })();
    </script>
