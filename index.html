<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anothen — Próximamente</title>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: crosshair;
            --reveal-x: 0px;
            --reveal-y: 0px;
            --reveal-radius: 120px;
            --fade-radius: 60px;
        }

        /* Background with subtle overlay - BLURRED version by default */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.2) 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -2;
            animation: subtleZoom 20s ease-in-out infinite;
            opacity: 0;
            transition: opacity 0.5s ease-in 0.3s;
        }

        body.image-loaded::before {
            opacity: 1;
        }


        @media (prefers-reduced-motion: reduce) {
            body::before {
                animation: none;
            }
        }

        @keyframes subtleZoom {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        /* Parallax zoom out animation - slide 01 */
        @keyframes parallaxZoomOut {
            0% {
                transform: scale(1.25);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Parallax zoom out with fade in - slide 02 */
        @keyframes parallaxZoomOutFadeIn {
            0% {
                transform: scale(1.20);
                opacity: 0.3;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Slide up with zoom out - slide 03 */
        @keyframes slideUpZoomOut {
            0% {
                transform: translateY(100vh) scale(1.30);
                opacity: 1;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Slide up with zoom out - slide 03 (mobile) */
        @keyframes slideUpZoomOutMobile {
            0% {
                transform: translateY(100vh) scale(1.10);
                opacity: 1;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Slide up with zoom out - slide 04 (50vh) */
        @keyframes slideUpZoomOut04 {
            0% {
                transform: translateY(50vh) scale(1.50);
                opacity: 1;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Slide up with zoom out - slide 05 (25vh) */
        @keyframes slideUpZoomOut05 {
            0% {
                transform: translateY(25vh) scale(1.60);
                opacity: 1;
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Parallax background layer */
        .parallax-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .parallax-layer-01 {
            background-image: url('./Images/parallax/slide-01.png?v=20260819');
            animation: parallaxZoomOut 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            z-index: 1;
        }

        .parallax-layer-02 {
            background-image: url('./Images/parallax/slide-02.png?v=20260819');
            animation: parallaxZoomOutFadeIn 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            z-index: 2;
        }

        .parallax-layer-03 {
            background-image: url('./Images/parallax/slide-03.png?v=20260819');
            animation: slideUpZoomOut 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s forwards;
            z-index: 3;
            opacity: 0;
        }

        .parallax-layer-04 {
            background-image: url('./Images/parallax/slide-04.png?v=20260819');
            animation: slideUpZoomOut04 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            z-index: 4;
        }

        .parallax-layer-05 {
            background-image: url('./Images/parallax/slide-05.png?v=20260819');
            animation: slideUpZoomOut05 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            z-index: 5;
        }

        /* Main container */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            z-index: 10;
            box-sizing: border-box;
        }

        /* Content sections */
        .content-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 0.5rem;
        }

        .content-section.top {
            flex: 0 0 auto;
        }

        .content-section.middle {
            flex: 1 1 auto;
        }

        .content-section.bottom {
            flex: 0 0 auto;
            margin-bottom: 5rem;
        }

        /* Logo area */
        .logo-area {
            position: relative;
            width: fit-content;
            margin: 0 auto;
            text-align: center;
            z-index: 10;
            color: #403e2c;
            animation: fadeInUp 0.8s ease-out 1.7s both, breathe 6s ease-in-out 2.7s infinite;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo-area:hover {
            transform: scale(1.05) !important;
        }

        .logo-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.1em;
            font-weight: 300;
        }

        .logo-text {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            letter-spacing: 0.15em;
            font-weight: 400;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }

        .logo-subtitle {
            font-size: 0.9rem;
            letter-spacing: 0.12em;
            font-weight: 500;
            opacity: 0.85;
            margin-top: 0.2rem;
        }

        /* Content wrapper - deprecated, use content-section instead */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            max-width: 900px;
            position: relative;
            z-index: 10;
        }

        /* Title */
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(3rem, 10vw, 7.2rem);
            font-weight: 400;
            letter-spacing: 0.12em;
            text-align: center;
            line-height: 1.2;
            max-width: 85vw;
            text-transform: uppercase;
            color: #4d473d;
            display: none; /* Hidden for parallax effect */
            animation: fadeInUp 0.8s ease-out 0.4s both, glow 3s ease-in-out 1.2s infinite;
            background: linear-gradient(90deg, transparent 0%, rgba(242, 230, 218, 0.4) 50%, transparent 100%);
            background-size: 1000px 100%;
            background-clip: text;
            -webkit-background-clip: text;
            animation: fadeInUp 0.8s ease-out 0.4s both, glow 3s ease-in-out 1.2s infinite, shimmer 3s linear infinite;
        }

        /* Separator line */
        .separator {
            width: 2px;
            height: 3rem;
            background-color: #4b4d37;
            margin: 0;
            position: relative;
            z-index: 10;
            margin-top: 2rem;
            animation: growLine 0.8s ease-out 2.1s both;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .separator:hover {
            background-color: rgba(242, 230, 218, 0.9);
            box-shadow: 0 0 8px rgba(242, 230, 218, 0.6);
            width: 2px;
        }

        /* Description text */
        .description {
            font-size: clamp(13px, 2vw, 16px);
            line-height: 1;
            text-align: center;
            max-width: min(60vw, 500px);
            position: relative;
            z-index: 10;
            margin-top: 2rem;
            color: #4b4d37;
            white-space: nowrap;
            font-weight: 300;
            letter-spacing: 0.02em;
            animation: fadeInUp 0.8s ease-out 2.2s both;
        }

        /* Subscription form */
        .subscription-form {
            display: flex;
            gap: 0;
            align-items: stretch;
            margin-top: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 100%;
            animation: fadeInUp 0.8s ease-out 2.3s both;
        }

        .subscription-form input {
            padding: 1rem 1.5rem;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            background-color: #f4f4ee;
            color: #423c33;
            flex: 1;
            min-width: 300px;
            transition: all 0.3s ease;
            letter-spacing: -0.02em;
        }

        .subscription-form input::placeholder {
            color: #a5a5a5;
            font-style: normal;
            font-family: 'Outfit', sans-serif;
        }

        .subscription-form input:focus {
            outline: none;
            background-color: #ffffff;
            box-shadow: inset 0 0 0 2px #403e2c;
            transition: all 0.3s ease;
        }

        .subscription-form button {
            padding: 1rem 2.5rem;
            border: none;
            background-color: #897c4b;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .subscription-form button:hover {
            background-color: #6b5d3a;
            transform: translateY(-2px);
        }

        .subscription-form button:active {
            transform: translateY(0);
        }

        /* Success message */
        .success-message {
            display: none;
            text-align: center;
            margin-top: 1rem;
            opacity: 0.9;
            font-size: 14px;
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 0.9;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 4px rgba(211, 212, 186, 1));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(211, 212, 186, 1)) drop-shadow(0 0 30px rgba(211, 212, 186, 0.6));
                transform: scale(1.08);
            }
            100% {
                filter: drop-shadow(0 0 4px rgba(211, 212, 186, 1));
                transform: scale(1);
            }
        }

        @keyframes fadeOutSubtle {
            from {
                opacity: 1;
                filter: drop-shadow(0 0 8px rgba(211, 212, 186, 0.6));
                transform: scale(1);
            }
            to {
                opacity: 1;
                filter: drop-shadow(0 0 0px rgba(211, 212, 186, 0));
                transform: scale(0.95);
            }
        }

        /* Sound icon states */
        #sound-hint {
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #sound-hint.active {
            animation: pulseGlow 1.5s ease-in-out infinite;
        }

        #sound-hint.deactivating {
            animation: fadeOutSubtle 0.8s ease-out forwards;
        }

        @keyframes growLine {
            from {
                height: 0;
                opacity: 0;
            }
            to {
                height: 3rem;
                opacity: 1;
            }
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(219, 212, 202, 0.3);
            }
            50% {
                text-shadow: 0 0 40px rgba(219, 212, 202, 0.6);
            }
        }

        @keyframes breathe {
            0%, 100% {
                opacity: 0.85;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.08);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) translateX(0px);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) translateX(var(--tx, 0px));
                opacity: 0;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }

        /* Particle styles */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 6;
        }

        .particle::before {
            content: '';
            display: block;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(242, 230, 218, 0.9) 0%, rgba(242, 230, 218, 0) 70%);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(242, 230, 218, 0.8), 0 0 12px rgba(242, 230, 218, 0.5);
        }

        @keyframes flyBird {
            0% {
                left: -100px;
            }
            100% {
                left: calc(100vw + 100px);
            }
        }

        /* 3D Birds Canvas */
        #birds-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: auto;
        }

        /* Hide old SVG birds - kept for compatibility */
        .bird {
            display: none !important;
        }

        /* Subscription hint */
        .subscription-hint {
            font-size: 12px;
            color: rgba(242, 230, 218, 0.65);
            letter-spacing: 0.03em;
            text-align: center;
            margin-top: 1rem;
            line-height: 1.5;
            font-weight: 300;
            opacity: 0.8;
            animation: fadeInUp 0.8s ease-out 2.4s both;
            white-space: nowrap;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .logo-area {
                top: 0.5rem;
            }

            .logo-area img {
                max-width: 120px !important;
                margin-bottom: 0.2rem !important;
            }

            .logo-text {
                font-size: 1.4rem;
            }

            .logo-subtitle {
                font-size: 0.6rem;
                margin-top: 0.2rem;
            }

            .separator {
                margin-top: 2rem;
            }

            .content-wrapper {
                gap: 1.2rem;
                margin-top: 1.5rem;
            }

            .subscription-hint {
                white-space: normal;
            }

            h1 {
                font-size: clamp(2.5rem, 9vw, 4.5rem);
            }

            .separator {
                height: 2rem;
            }

            .description {
                font-size: 14px;
                max-width: 85vw;
                line-height: 1;
            }

            .parallax-layer-03 {
                background-image: url('./Images/parallax/slide-03-movil.png?v=20260819');
                background-size: contain;
                background-position: center;
                background-repeat: no-repeat;
                animation: slideUpZoomOutMobile 2s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s forwards;
            }

            .subscription-form {
                gap: 0;
                flex-direction: column;
                width: 90%;
                max-width: 100%;
            }

            .subscription-form input {
                width: 100%;
                min-width: 100%;
                border-radius: 4px 4px 0 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                font-family: 'Outfit', sans-serif;
                background-color: #f4f4ee;
            }

            .subscription-form button {
                width: 100%;
                border-radius: 0 0 4px 4px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
                height: 100dvh;
                padding-bottom: 4rem;
            }

            .content-section {
                gap: 0.2rem;
            }

            .content-section.bottom {
                gap: 1rem;
            }

            .logo-area {
                margin-top: 0;
            }

            .logo-text {
                font-size: 1.1rem;
                letter-spacing: 0.1em;
            }

            .logo-subtitle {
                font-size: 0.6rem;
                margin-top: 0.2rem;
            }

            .content-wrapper {
                gap: 1rem;
            }

            h1 {
                font-size: clamp(2rem, 8vw, 3.5rem);
                letter-spacing: 0.08em;
            }

            .separator {
                height: 1.5rem;
                margin-top: 1.4rem;
            }

            .description {
                font-size: 13px;
                max-width: 70vw;
                line-height: 1;
                margin: 1.4rem 0 1.1rem;
            }

            .subscription-form input {
                font-size: 16px;
                padding: 0.75rem 1rem;
                border-radius: 4px 4px 0 0;
                font-family: 'Outfit', sans-serif;
                background-color: #f4f4ee;
            }

            .subscription-form button {
                font-size: 10px;
                padding: 0.75rem 1rem;
                border-radius: 0 0 4px 4px;
                letter-spacing: 0.1em;
            }
        }
    </style>
</head>
<body>
    <!-- Parallax background layers -->
    <div class="parallax-bg parallax-layer-01"></div>
    <div class="parallax-bg parallax-layer-02"></div>
    <div class="parallax-bg parallax-layer-03"></div>
    <div class="parallax-bg parallax-layer-04"></div>
    <div class="parallax-bg parallax-layer-05"></div>

    <!-- 3D Birds Canvas -->
    <canvas id="birds-canvas"></canvas>

    <div id="particles-container"></div>
    <button id="sound-hint" style="position: fixed; top: 1rem; right: 1rem; width: 48px; height: 48px; border: none; background: none; cursor: pointer; z-index: 15; opacity: 0; animation: fadeInUp 0.8s ease-out 3.0s both; padding: 0; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="#d3d4ba" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <!-- Speaker cone -->
            <path d="M 3 9 L 7 9 L 12 4 L 12 20 L 7 15 L 3 15 Z"></path>
            <!-- Sound waves -->
            <path d="M 16 6 Q 18 8 18 12 Q 18 16 16 18"></path>
            <path d="M 20 2 Q 23 5 23 12 Q 23 19 20 22"></path>
        </svg>
    </button>
    <div class="container">
        <!-- TOP SECTION: Logo, Separator, Description -->
        <div class="content-section top">
            <div class="logo-area" id="logo">
                <img src="./Images/Logo-Anothen.png" alt="Anothen Logo" class="logo" style="max-width: 200px; height: auto; display: block; margin: 0 auto 0;">
                <div class="logo-subtitle">Nacidos de lo alto.</div>
            </div>

            <div class="separator"></div>

            <p class="description">
                Estamos preparando algo con propósito,<br>para acompañarte cada día.
            </p>
        </div>

        <!-- MIDDLE SECTION: Spacer (grows to fill viewport) -->
        <div class="content-section middle"></div>

        <!-- BOTTOM SECTION: Form, Success, Hint -->
        <div class="content-section bottom">
            <form class="subscription-form" id="subscriptionForm">
                <input
                    type="email"
                    placeholder="Tu correo electrónico"
                    required
                    aria-label="Correo electrónico"
                >
                <button type="submit">Suscribirme</button>
            </form>

            <div class="success-message" id="successMessage">
                ✓ Gracias. Te notificaremos pronto.
            </div>

            <p class="subscription-hint">
                Síguelo de cerca. Sé el primero en saber cuándo llegamos.
            </p>
        </div>
    </div>

    <script>
        // Load background images dynamically
        window.addEventListener('DOMContentLoaded', function() {
            // Load blurred image for overlay (revela blur en spotlight)
            const blurImg = new Image();
            blurImg.onload = function() {
                const overlay = document.getElementById('blurred-overlay');
                overlay.style.backgroundImage = "url('./Images/Slide-web-02-blur.jpg?v=20260819')";
                overlay.style.backgroundSize = "cover";
                overlay.style.backgroundPosition = "center";
                document.body.classList.add('image-loaded');
            };
            blurImg.onerror = function() {
                console.log('Blurred image not found');
            };
            blurImg.src = './Images/Slide-web-02-blur.jpg?v=20260819';

            // Load sharp image for body::before (fondo enfocado)
            const sharpImg = new Image();
            sharpImg.onload = function() {
                const style = document.createElement('style');
                style.textContent = `body::before { background-image: url('./Images/Slide-web-01.jpg?v=20260819') !important; }`;
                document.head.appendChild(style);
            };
            sharpImg.onerror = function() {
                console.log('Sharp background image not found');
            };
            sharpImg.src = './Images/Slide-web-01.jpg?v=20260819';
        });

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles-container');
            const particleCount = 60;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                const startX = Math.random() * window.innerWidth;
                const duration = 15 + Math.random() * 15; // 15-30 seconds
                const delay = Math.random() * 5;

                particle.style.left = startX + 'px';
                particle.style.top = window.innerHeight + 'px';
                particle.style.animation = `float ${duration}s linear ${delay}s infinite`;

                container.appendChild(particle);
            }
        }

        createParticles();

        // Create flying birds
        function createBirds() {
            const container = document.getElementById('particles-container');

            function createBird() {
                const bird = document.createElement('div');
                bird.className = 'bird';

                const startY = Math.random() * (window.innerHeight * 0.4) + window.innerHeight * 0.05; // 5% to 45%
                const duration = 18 + Math.random() * 12; // 18-30 seconds
                const delay = Math.random() * 15;

                bird.style.top = startY + 'px';
                bird.style.animation = `flyBird ${duration}s linear ${delay}s infinite`;

                container.appendChild(bird);
            }

            // Create 3-5 birds
            const birdCount = 3 + Math.floor(Math.random() * 3);
            for (let i = 0; i < birdCount; i++) {
                createBird();
            }
        }

        createBirds();

        // Create ambient enchanted background music
        function createAmbientBackgroundMusic() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();

            // Create multiple oscillators for a rich ambient pad
            function createAmbientPad() {
                const frequencies = [110, 165, 220, 277]; // Deep magical frequencies
                const oscillators = [];
                const gains = [];

                frequencies.forEach((freq, index) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();

                    osc.connect(gain);
                    gain.connect(audioContext.destination);

                    osc.type = 'sine';
                    osc.frequency.value = freq;

                    // Gentle volume with slight variation
                    gain.gain.setValueAtTime(0.08 + (Math.random() * 0.04), audioContext.currentTime);

                    // Create subtle wave modulation
                    const lfo = audioContext.createOscillator();
                    const lfoGain = audioContext.createGain();
                    lfo.frequency.value = 0.3 + (index * 0.1); // Slow modulation
                    lfo.connect(lfoGain);
                    lfoGain.connect(gain.gain);
                    lfoGain.gain.value = 0.02;

                    osc.start(audioContext.currentTime);
                    lfo.start(audioContext.currentTime);

                    oscillators.push(osc);
                    gains.push(gain);
                });
            }

            createAmbientPad();
        }

        // Toggle ambient sound with click
        let soundStarted = false;
        let audioContext = null;
        let oscillators = [];

        const hint = document.getElementById('sound-hint');
        hint.addEventListener('click', function toggleSound() {

            if (!soundStarted) {
                // Start sound
                audioContext = new (window.AudioContext || window.webkitAudioContext)();

                // Resume audio context on mobile (required for autoplay policy)
                if (audioContext.state === 'suspended') {
                    audioContext.resume().catch(e => console.log('Audio resume failed:', e));
                }

                // Epic, ethereal frequencies like Enya (no heavy bass)
                const frequencies = [110, 165, 220, 277, 330, 440]; // Mid to high frequencies
                const isMobile = window.innerWidth <= 768;
                const baseVolume = isMobile ? 0.1 : 0.06; // Subtle but present

                frequencies.forEach((freq, index) => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();

                    osc.connect(gain);
                    gain.connect(audioContext.destination);

                    osc.type = 'sine';
                    osc.frequency.value = freq;

                    // Start with volume 0, fade in to target volume over 1 second
                    const targetVolume = (baseVolume / (index + 1)) * 0.8;
                    gain.gain.setValueAtTime(0, audioContext.currentTime);
                    gain.gain.linearRampToValueAtTime(targetVolume, audioContext.currentTime + 1);

                    // Slow, smooth LFO for ethereal effect
                    const lfo = audioContext.createOscillator();
                    const lfoGain = audioContext.createGain();
                    lfo.type = 'sine';
                    lfo.frequency.value = 0.15 + (index * 0.08); // Very slow modulation
                    lfo.connect(lfoGain);
                    lfoGain.connect(gain.gain);
                    lfoGain.gain.value = 0.02; // Subtle, smooth breathing

                    osc.start(audioContext.currentTime);
                    lfo.start(audioContext.currentTime);

                    oscillators.push({ osc, lfo, gain });
                });

                soundStarted = true;
                if (hint) {
                    hint.classList.remove('deactivating');
                    hint.classList.add('active');
                }
            } else {
                // Stop sound immediately
                const fadeOutDuration = 0; // Instant stop
                const stopTime = audioContext.currentTime + fadeOutDuration;

                oscillators.forEach(({ osc, lfo, gain }) => {
                    // Fade out volume very smoothly over 3.5 seconds - imperceptible cut
                    gain.gain.cancelScheduledValues(audioContext.currentTime);
                    gain.gain.linearRampToValueAtTime(0.00001, stopTime); // Almost to 0, not abrupt stop

                    // Stop oscillators only after fade completes
                    osc.stop(stopTime + 0.1);
                    lfo.stop(stopTime + 0.1);
                });

                // Clean up after fade out completes
                setTimeout(() => {
                    oscillators = [];
                    if (audioContext && audioContext.state !== 'closed') {
                        audioContext.close();
                    }
                    audioContext = null;
                }, (fadeOutDuration + 0.2) * 1000); // Wait for complete fade

                soundStarted = false;
                if (hint) {
                    hint.classList.remove('active');
                    hint.classList.add('deactivating');
                    setTimeout(() => hint.classList.remove('deactivating'), 800);
                }
            }
        });

        const form = document.getElementById('subscriptionForm');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = form.querySelector('input[type="email"]').value;

            // Here you would typically send the email to your backend
            console.log('Email subscribed:', email);

            // Show success message
            form.style.display = 'none';
            successMessage.classList.add('show');

            // Optional: Reset form after 3 seconds
            setTimeout(() => {
                form.reset();
                form.style.display = 'flex';
                successMessage.classList.remove('show');
            }, 3000);
        });

        // Prevent zoom/pinch on mobile
        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        // Prevent double-tap zoom
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
    </script>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.min.js" crossorigin="anonymous"></script>

    <script>
        // ===== 3D BIRDS SYSTEM =====
        // Check if Three.js is available
        if (typeof THREE === 'undefined') {
            console.warn('Three.js library failed to load. Birds will not be rendered.');
        }

        class BirdsScene {
            constructor() {
                // Check if Three.js is available
                if (typeof THREE === 'undefined') {
                    console.error('Three.js not loaded. Cannot initialize birds.');
                    return;
                }

                this.canvas = document.getElementById('birds-canvas');
                if (!this.canvas) {
                    console.error('Birds canvas element not found.');
                    return;
                }

                this.birds = [];
                this.birdMeshes = [];
                this.mousePos = { x: 0, y: 0, z: 0 };
                this.isMobile = window.innerWidth <= 768;
                this.birdCount = this.isMobile ? 15 : 30;

                try {
                    this.init3DScene();
                    this.createBirds();
                    this.animate();
                    this.setupEventListeners();
                    console.log(`3D Birds scene initialized: ${this.birdCount} birds on ${this.isMobile ? 'mobile' : 'desktop'}`);
                } catch (error) {
                    console.error('Error initializing birds scene:', error);
                }
            }

            init3DScene() {
                // Scene setup
                this.scene = new THREE.Scene();
                this.scene.background = null;
                this.scene.fog = null;

                // Camera - orthographic to match 2D layout
                const width = window.innerWidth;
                const height = window.innerHeight;
                this.camera = new THREE.OrthographicCamera(
                    width / -2, width / 2,
                    height / 2, height / -2,
                    0.1, 1000
                );
                this.camera.position.z = 500;

                // Renderer
                this.renderer = new THREE.WebGLRenderer({
                    canvas: this.canvas,
                    alpha: true,
                    antialias: true,
                    preserveDrawingBuffer: false
                });
                this.renderer.setSize(width, height);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
                this.renderer.setClearColor(0x000000, 0);

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
                directionalLight.position.set(100, 100, 100);
                this.scene.add(directionalLight);

                window.addEventListener('resize', () => this.onWindowResize());
            }

            createBirds() {
                for (let i = 0; i < this.birdCount; i++) {
                    const bird = new Bird(this.scene, this.isMobile);
                    this.birds.push(bird);
                    this.birdMeshes.push(bird.group);
                }
            }

            updateBoids() {
                // Update each bird's position based on flocking rules
                for (let i = 0; i < this.birds.length; i++) {
                    const bird = this.birds[i];

                    // Separation: avoid crowding neighbors
                    let separation = new THREE.Vector3();
                    let alignmentVel = new THREE.Vector3();
                    let cohesion = new THREE.Vector3();
                    let neighborCount = 0;

                    for (let j = 0; j < this.birds.length; j++) {
                        if (i === j) continue;

                        const other = this.birds[j];
                        const distance = bird.position.distanceTo(other.position);

                        if (distance < 150) {
                            // Separation
                            const diff = new THREE.Vector3().subVectors(
                                bird.position,
                                other.position
                            );
                            diff.normalize();
                            diff.multiplyScalar(1 / (distance + 1));
                            separation.add(diff);

                            // Alignment
                            alignmentVel.add(other.velocity);

                            // Cohesion
                            cohesion.add(other.position);

                            neighborCount++;
                        }
                    }

                    // Apply flocking rules
                    if (neighborCount > 0) {
                        alignmentVel.divideScalar(neighborCount);
                        alignmentVel.normalize();
                        alignmentVel.multiplyScalar(0.008);
                        bird.velocity.add(alignmentVel);

                        cohesion.divideScalar(neighborCount);
                        cohesion.sub(bird.position);
                        cohesion.normalize();
                        cohesion.multiplyScalar(0.004);
                        bird.velocity.add(cohesion);
                    }

                    separation.multiplyScalar(0.03);
                    bird.velocity.add(separation);

                    // Mouse avoidance
                    const mouseDistance = bird.position.distanceTo(this.mousePos);
                    if (mouseDistance < 200) {
                        const fleeVector = new THREE.Vector3().subVectors(
                            bird.position,
                            this.mousePos
                        );
                        fleeVector.normalize();
                        fleeVector.multiplyScalar(0.05);
                        bird.velocity.add(fleeVector);
                    }

                    // Speed limit
                    const speed = bird.velocity.length();
                    if (speed > 1.2) {
                        bird.velocity.normalize().multiplyScalar(1.2);
                    }
                    if (speed < 0.15) {
                        bird.velocity.normalize().multiplyScalar(0.15);
                    }

                    // Reduce Z movement for horizontal flight
                    bird.velocity.z *= 0.5;

                    // Boundary conditions with wrap-around
                    const width = window.innerWidth;
                    const height = window.innerHeight;
                    const margin = 50;

                    if (bird.position.x > width / 2 + margin) {
                        bird.position.x = -width / 2 - margin;
                    }
                    if (bird.position.x < -width / 2 - margin) {
                        bird.position.x = width / 2 + margin;
                    }
                    if (bird.position.y > height / 2 + margin) {
                        bird.position.y = -height / 2 - margin;
                    }
                    if (bird.position.y < -height / 2 - margin) {
                        bird.position.y = height / 2 + margin;
                    }

                    // Update position
                    bird.position.add(bird.velocity);
                    bird.update();
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                this.updateBoids();
                this.renderer.render(this.scene, this.camera);
            }

            setupEventListeners() {
                document.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mousePos.x = e.clientX - rect.width / 2;
                    this.mousePos.y = -(e.clientY - rect.height / 2);
                });

                document.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 1) {
                        const touch = e.touches[0];
                        const rect = this.canvas.getBoundingClientRect();
                        this.mousePos.x = touch.clientX - rect.width / 2;
                        this.mousePos.y = -(touch.clientY - rect.height / 2);
                    }
                });
            }

            onWindowResize() {
                const width = window.innerWidth;
                const height = window.innerHeight;

                this.camera.left = width / -2;
                this.camera.right = width / 2;
                this.camera.top = height / 2;
                this.camera.bottom = height / -2;
                this.camera.updateProjectionMatrix();

                this.renderer.setSize(width, height);
            }
        }

        // Individual bird class with boids behavior
        class Bird {
            constructor(scene, isMobile = false) {
                this.scene = scene;
                this.isMobile = isMobile;
                this.position = new THREE.Vector3(
                    (Math.random() - 0.5) * window.innerWidth,
                    (Math.random() - 0.5) * window.innerHeight * 0.8,
                    (Math.random() - 0.5) * 10
                );
                this.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.8,
                    (Math.random() - 0.5) * 0.8,
                    (Math.random() - 0.5) * 0.05
                );

                this.createMesh();
            }

            createMesh() {
                // Create a simple low-poly bird using cones and spheres
                this.group = new THREE.Group();
                this.group.position.copy(this.position);

                // Body - main cylinder/cone
                const bodyGeometry = new THREE.ConeGeometry(8, 20, 6);
                const bodyMaterial = new THREE.MeshPhongMaterial({
                    color: 0x4a4a4a,
                    shininess: 30
                });
                const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                body.castShadow = true;
                body.receiveShadow = true;
                this.group.add(body);

                // Head - smaller sphere
                const headGeometry = new THREE.SphereGeometry(6, 8, 8);
                const headMaterial = new THREE.MeshPhongMaterial({
                    color: 0x3a3a3a,
                    shininess: 40
                });
                const head = new THREE.Mesh(headGeometry, headMaterial);
                head.position.z = 12;
                head.castShadow = true;
                head.receiveShadow = true;
                this.group.add(head);

                // Eyes - tiny spheres
                const eyeGeometry = new THREE.SphereGeometry(1.5, 6, 6);
                const eyeMaterial = new THREE.MeshPhongMaterial({
                    color: 0xffc800,
                    shininess: 100
                });
                const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                leftEye.position.set(-2.5, 2, 16);
                this.group.add(leftEye);

                const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                rightEye.position.set(2.5, 2, 16);
                this.group.add(rightEye);

                // Wings - triangular geometry
                const wingGeometry = new THREE.ConeGeometry(25, 10, 3);
                wingGeometry.rotateX(Math.PI * 0.3);

                const wingMaterial = new THREE.MeshPhongMaterial({
                    color: 0x5a5a5a,
                    shininess: 20,
                    side: THREE.DoubleSide
                });

                this.leftWing = new THREE.Mesh(wingGeometry, wingMaterial);
                this.leftWing.position.set(-12, 0, 0);
                this.leftWing.castShadow = true;
                this.leftWing.receiveShadow = true;
                this.group.add(this.leftWing);

                this.rightWing = new THREE.Mesh(wingGeometry, wingMaterial);
                this.rightWing.position.set(12, 0, 0);
                this.rightWing.scale.x = -1;
                this.rightWing.castShadow = true;
                this.rightWing.receiveShadow = true;
                this.group.add(this.rightWing);

                // Tail - cone pointing back
                const tailGeometry = new THREE.ConeGeometry(6, 15, 4);
                const tailMaterial = new THREE.MeshPhongMaterial({
                    color: 0x4a4a4a,
                    shininess: 25
                });
                const tail = new THREE.Mesh(tailGeometry, tailMaterial);
                tail.position.z = -15;
                tail.rotation.x = Math.PI / 2;
                tail.castShadow = true;
                tail.receiveShadow = true;
                this.group.add(tail);

                this.scene.add(this.group);
                this.time = Math.random() * Math.PI * 2;
            }

            update() {
                this.group.position.copy(this.position);

                // Orient bird toward direction of movement
                if (this.velocity.length() > 0.1) {
                    const direction = this.velocity.clone().normalize();
                    this.group.lookAt(
                        this.position.clone().add(direction)
                    );
                }

                // Animate wings
                this.time += 0.05;
                const wingFlap = Math.sin(this.time) * 0.5;
                this.leftWing.rotation.z = wingFlap;
                this.rightWing.rotation.z = -wingFlap;
            }
        }

        // Initialize birds scene when DOM is ready
        let birdsScene = null;
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                try {
                    birdsScene = new BirdsScene();
                } catch (error) {
                    console.error('Failed to initialize BirdsScene:', error);
                }
            }, 100);
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            try {
                if (birdsScene && birdsScene.renderer) {
                    birdsScene.renderer.dispose();
                }
            } catch (error) {
                console.error('Error during cleanup:', error);
            }
        });
    </script>
